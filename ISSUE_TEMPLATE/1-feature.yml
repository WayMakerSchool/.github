name: "✨ 기능 추가"
description: 새로운 기능이나 작업을 등록해요.
title: "[Feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        만들고 싶은 기능을 적어주세요. 작업 브랜치는 `develop`에서 `feat/기능이름`으로 만들어요.

  - type: textarea
    id: description
    attributes:
      label: 📝 설명
      description: 어떤 기능인지, 왜 필요한지 적어주세요.
      placeholder: 예) 할 일을 다 끝냈을 때 목록에서 지울 수 있으면 좋겠어요.
    validations:
      required: true

  - type: textarea
    id: todo
    attributes:
      label: ✅ 할 일
      description: 작업을 작은 단위로 나눠서 적어주세요.
      value: |
        - [ ]
        - [ ]
    validations:
      required: true

  - type: input
    id: due
    attributes:
      label: 📅 마감일 (선택)
      placeholder: 예) 2026-10-15

  - type: textarea
    id: reference
    attributes:
      label: 📎 참고 자료 (선택)
      description: 디자인, 링크, 스크린샷 등을 붙여주세요.
